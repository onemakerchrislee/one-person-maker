
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一人造物工作室，一个普通人用AI把想法变成现实。">
  <title>一人造物工作室</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
    margin: 0;
    background-color: #101114;
    background-image: url("studio-bg.png");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    color: #f5f5f5;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    header {
      padding: 28px 8%;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    main {
      max-width: 900px;
      margin: 100px auto;
      padding: 0 24px;
    }

    .tag {
      color: #aaa;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.3;
      margin: 24px 0;
    }

    .intro {
      color: #aaa;
      font-size: 18px;
      line-height: 1.9;
    }

    .projects {
      margin-top: 80px;
    }

    .project {
      padding: 24px 0;
      border-top: 1px solid #333;
    }

    .project h3 {
      font-size: 20px;
    }

    .project p {
      color: #999;
      line-height: 1.8;
    }

    footer {
      padding: 40px 8%;
      color: #777;
      border-top: 1px solid #333;
      text-align: center;
    }
    @media (max-width: 650px) {
  body {
    background-size: 100% auto;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: scroll;
  }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">一人造物工作室.</div>
  </header>

  <main>

    <div class="tag">
      ONE PERSON MAKER STUDIO
    </div>

    <h1>
      用 AI，<br>
      把想法变成现实。
    </h1>

    <p class="intro">
      一个普通人的 AI 创造实验室。<br>
      探索人工智能、软件开发、自动化与数字产品。
    </p>

    <section class="projects">

      <h2>我的造物计划</h2>

      <div class="project">
        <h3>01 / 个人网站</h3>
        <p>从零开始，制作属于自己的第一个网站。</p>
      </div>

      <div class="project">
        <h3>02 / AI 小工具</h3>
        <p>利用人工智能开发实用的数字工具。</p>
      </div>

      <div class="project">
        <h3>03 / 自动化实验</h3>
        <p>让重复的工作变得更加简单。</p>
      </div>

    </section>

  </main>

  <footer>
    © 2026 一人造物工作室
  </footer>

</body>
</html>
